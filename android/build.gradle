buildscript {
  repositories { google(); mavenCentral() }
  dependencies { classpath("com.android.tools.build:gradle:8.7.2") }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Codegen New Architecture: plugin sinh NativeLiquidTabsSpec (abstract class) từ
// src/specs/NativeLiquidTabs.ts vào package khai ở codegenConfig.android.
apply plugin: 'com.facebook.react'

// Không tự phân giải đường dẫn react-native ở đây: plugin `com.facebook.react` đã lo,
// và bản trước có một hàm `resolveReactNativeDir()` KHÔNG ai gọi — dead code duy nhất
// tác dụng là làm VỠ parse Groovy (regex JS `/…$/` trong GString ⇒ "token recognition
// error at '/'"). Nó sống được tới 29/07 vì Android chưa build lần nào; lần assemble
// đầu tiên là lần nó bị phát hiện.
android {
  namespace 'com.tantrancover.liquidtabs'
  compileSdk 35

  defaultConfig {
    minSdk 24
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }

  sourceSets {
    main {
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
    }
  }
}

repositories { google(); mavenCentral() }

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.13.1'
  // Parser SVG đầy đủ — USER chốt 29/07 thay cho PathParser: xử lý viewBox,
  // <g transform> lồng nhau, fill-rule, gradient, clip-path. ~100KB.
  implementation 'com.caverock:androidsvg-aar:1.4'
}

react {
  jsRootDir = file("../src/specs")
  libraryName = "liquidtabs"
  codegenJavaPackageName = "com.tantrancover.liquidtabs"
}
